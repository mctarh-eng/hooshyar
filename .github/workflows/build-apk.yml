name: Build Android APK (هوش‌یار)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-apk.yml'
    tags: ['v*']
  workflow_dispatch:

# HAS_KEYSTORE: secrets context is not allowed in step-level `if`,
# so we pre-compute it here (env at job level CAN read secrets).
env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Sync Capacitor config into Android project
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: bunx cap sync android

      - name: Warn if backend URL is not configured yet
        if: ${{ vars.CAP_SERVER_URL == '' }}
        run: |
          echo "### ⚠️ متغیر CAP_SERVER_URL تنظیم نشده" >> $GITHUB_STEP_SUMMARY
          echo "این APK ساخته شد ولی آدرس سرور داخلش placeholder است." >> $GITHUB_STEP_SUMMARY
          echo "برای فعال شدن اپ: Settings → Secrets and variables → Actions → Variables → متغیر CAP_SERVER_URL با آدرس HTTPS اپلیکیشن بساز، بعد دوباره Run workflow بزن." >> $GITHUB_STEP_SUMMARY

      - name: Decode release keystore (if provided)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/hooshyar.keystore
          cat > android/keystore.properties <<EOF
          storeFile=hooshyar.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK + AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-out/hooshyar-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/release/app-release.apk apk-out/hooshyar-release.apk 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/app-release.aab apk-out/hooshyar-release.aab 2>/dev/null || true
          ls -la apk-out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hooshyar-apk
          path: apk-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*
          generate_release_notes: true
